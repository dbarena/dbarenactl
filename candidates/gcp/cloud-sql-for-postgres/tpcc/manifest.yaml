# Sweep manifest for Google Cloud SQL for Postgres
#
# Suppply with `dbarenactl run --candidate=candidates/gcp/cloud-sql-for-postgres/tpcc/manifest.yaml`.
#
# No 'small' tier; test points start with 'medium' as N4's minimum memory
# ratio (2 GB/vCPU) enforces a minimum of 2vCPU/4GB which is identical to 'medium'.
provider: GCP
product: Cloud SQL for Postgres
plan: Enterprise
workload: tpcc
region: us-east1
scenario_path: scenario.yaml
test_points:
  # HYPERDISK_BALANCED lowest allowed value is 3,000 IOPS and 140 MiB/s.
  - tier: medium
    bound_type: io
    set:
      warehouses: "160"
      client_threads: "1,2,4,8,12"
      driver_instance_type: c4a-standard-4
      disk_size_gb: "32"
      disk_iops: "3000"
      disk_throughput_mibps: "140"
      db_instance_type: db-custom-N4-2-4096
      disk_type: HYPERDISK_BALANCED
  - tier: medium
    bound_type: compute
    set:
      warehouses: "16"
      client_threads: "1,2,4,8,12"
      driver_instance_type: c4a-standard-4
      disk_size_gb: "20"
      disk_iops: "3000"
      disk_throughput_mibps: "140"
      db_instance_type: db-custom-N4-2-4096
      disk_type: HYPERDISK_BALANCED
  - tier: large
