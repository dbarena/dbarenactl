apiVersion: bench/v1
kind: Scenario
metadata:
  name: orioledb-tpcc-tiers
  labels:
    engine: orioledb
    workload: tpcc
inputs:
  supabase_org_id:
    type: string
    required: true
    description: Supabase organization id for the target project
  orioledb:
    type: bool
    default: true
    description: Use OrioleDB as storage engine
  project_size:
    type: string
    default: small
    description: Supabase project size
  disk_size_gb:
    type: int
    default: 20
    description: Disk size in GB
  disk_iops:
    type: int
    default: 1000
    description: Provisioned IOPS
  disk_throughput_mibps:
    type: int
    # 0 (default) omits throughput_mibps from the disk-config API call
    # so the Management API picks its own gp3 throughput.
    # 
    # Ignored when disk_type is io2 (that disk type doesn't accept this attribute).
    default: 0
    description: Provisioned disk throughput
  disk_type:
    type: string
    default: gp3
    description: Disk type, gp3 or io2
  profile:
    type: string
    default: ""
    description: Supabase infrastructure profile to target
  warehouses:
    type: int
    default: 80
    description: Number of warehouses to simulate
  prepare_threads:
    type: int
    default: 12
    description: Number of clients for data loading
  client_threads:
    type: list
    default: [1, 2, 4, 8, 16, 24]
    description: Number of clients for the actual benchmark
  duration:
    type: duration
    default: 30m
    description: Duration of the actual benchmark
  warmup_duration:
    type: duration
    default: 5m
    description: Duration of the warmup phase for the benchmark
  wal_settle_duration_secs:
    type: int
    default: 720
    description: Pause time after the initial data load to allow for cooldown
  driver_instance_type:
    type: string
    # Load driver (EC2) machine type, independent of the target's capabilities. 
    # Bump this alongside the target to avoid accidental bottlenecks.
    default: c8gd.xlarge
    description: Instance type of the load driver instance
  region:
    type: string
    default: "us-east-1"
    description: AWS region to pick
  metrics_enabled:
    type: bool
    default: false
    description: Whether to capture metrics on the load driver instance
  metrics_interval_secs:
    type: int
    default: 5
    description: Interval in which to get load test driver metrics
target:
  provider: supabase
  config:
    region: "{{ inputs.region }}"
    org_id: "{{ inputs.supabase_org_id }}"
    orioledb: "{{ inputs.orioledb }}"
    # Fixed, not an input: this scenario exists to isolate the DB engine/hardware
    # as the only variable in the Supabase-vs-RDS comparison. RDS has no HA
    # add-on equivalent and no Supavisor-style pooler, so both are held fixed
    # here rather than exposed as knobs. See docs/supabase-vs-rds-benchmark.md.
    high_availability: false
    connection_mode: direct
    profile: "{{ inputs.profile }}"
    project_size: "{{ inputs.project_size }}"
    disk_size_gb: "{{ inputs.disk_size_gb }}"
    disk_iops: "{{ inputs.disk_iops }}"
    disk_throughput_mibps: "{{ inputs.disk_throughput_mibps }}"
    disk_type: "{{ inputs.disk_type }}"
suite:
  iterations: 1
  fixtures:
    - client_threads:
        type: list
        params:
          values: "{{ inputs.client_threads }}"
  benchmarks:
    - name: orioledb
      steps:
        - name: get-pg-version
          type: metadata
          command: sql
          args:
            name: pg_version
            query: "SELECT version()"
        # To let this scenario support toggling the "orioledb" input boolean to false, ensure
        # this SQL can run on vanilla Postgres too. For vanilla Postgres, it returns NULL. For
        # OrioleDB, it returns the extension version. (Previously "SELECT orioledb_version()"
        # was used, but that function does not exist on vanilla Postgres.)
        - name: get-orioledb-extension-version
          type: metadata
          command: sql
          args:
            name: orioledb_extension_version
            query: "SELECT extversion FROM pg_catalog.pg_extension WHERE extname = 'orioledb'"
        - name: get-pg-settings
          type: metadata
          command: sql
          args:
            name: pg_settings
            # Captured for transparency, not enforced equal between platforms:
            # each side auto-tunes these per instance size using its own
            # formula, and the comparison targets each platform's managed
            # defaults rather than identical raw hardware.
            query: >-
              SELECT string_agg(name || '=' || setting, ', ' ORDER BY name) FROM pg_settings WHERE name IN ('shared_buffers', 'work_mem', 'max_connections', 'effective_cache_size')
        - name: network-rtt-baseline
          # Runs on the driver (the EC2 instance, once bootstrapped) — a TCP
          # connect-timing loop against the target host/port. Doesn't fix the
          # fact that Supabase's AZ placement isn't controllable by us (unlike
          # the pinned-AZ RDS scenario), but lets the results doc quantify how
          # much of any throughput gap traces to network path vs. engine/hardware.
          type: shell
          args:
            command: |
              bash -c '
                for i in $(seq 1 10); do
                  start_ns=$(date +%s%N)
                  timeout 5 bash -c "exec 3<>/dev/tcp/{{ target.outputs.host }}/{{ target.outputs.port }}" 2>/dev/null
                  status=$?
                  end_ns=$(date +%s%N)
                  if [ $status -eq 0 ]; then
                    echo "network-rtt-baseline: tcp_connect_ms=$(( (end_ns - start_ns) / 1000000 ))"
                  else
                    echo "network-rtt-baseline: tcp_connect_ms=timeout"
                  fi
                done
              '
        - name: prepare-warehouses
          type: go-tpc
          command: prepare
          args:
            warehouses: "{{ inputs.warehouses }}"
            # parallelize data load
            threads: "{{ inputs.prepare_threads }}"
            no-check: ""
            dropdata: ""
        - name: wal-settle-pause
          # wait for a while to let the system cool down after the batch load
          type: shell
          args:
            command: "sleep {{ inputs.wal_settle_duration_secs }}"
        - name: warm-up
          # Discarded: workloadMetrics is overwritten by the next (measured)
          # go-tpc run step below, so this only serves to bring the connection
          # pool and buffer cache to steady state before the timed window.
          type: go-tpc
          command: run
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ fixture.client_threads }}"
            time: "{{ inputs.warmup_duration }}"
        - name: get-wal-size-before-benchmark
          # Disk-sizing signal
          type: metadata
          command: sql
          args:
            name: wal_size_before
            query: >-
              SELECT 'wal_bytes=' || wal_bytes FROM pg_stat_wal
        - name: get-db-size-before-benchmark
          # OrioleDB-specific disk-size signal
          type: metadata
          command: sql
          args:
            name: db_size_before
            query: >-
              SELECT 'total_bytes=' || (pg_database_size(current_database()) + (SELECT COALESCE(sum(size), 0) FROM pg_ls_waldir()) + (SELECT COALESCE(sum(undo_size), 0) FROM orioledb_undo_size()))::bigint
        - name: benchmark
          type: go-tpc
          command: run
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ fixture.client_threads }}"
            time: "{{ inputs.duration }}"
            interval: "1s"
        - name: get-wal-size-after-benchmark
          type: metadata
          command: sql
          args:
            name: wal_size_after
            query: >-
              SELECT 'wal_bytes=' || wal_bytes FROM pg_stat_wal
        - name: get-db-size-after-benchmark
          type: metadata
          command: sql
          args:
            name: db_size_after
            query: >-
              SELECT 'total_bytes=' || (pg_database_size(current_database()) + (SELECT COALESCE(sum(size), 0) FROM pg_ls_waldir()) + (SELECT COALESCE(sum(undo_size), 0) FROM orioledb_undo_size()))::bigint
driver:
  provider: ec2
  config:
    module: ./deployments/ec2/loaddriver_gotpc
    vars:
      instance_type: "{{ inputs.driver_instance_type }}"
      region: "{{ inputs.region }}"
      vector_enabled: "{{ inputs.metrics_enabled }}"
      vector_sink: stdout
      vector_host_metrics_scrape_interval_secs: "{{ inputs.metrics_interval_secs }}"
      tags:
        created-by: benchctl
collector:
  provider: stdout
  config:
    file_enabled: true
