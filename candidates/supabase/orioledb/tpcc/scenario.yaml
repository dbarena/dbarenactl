apiVersion: bench/v1
kind: Scenario
metadata:
  name: orioledb-tpcc-tiers
  labels:
    engine: orioledb
    workload: tpcc
inputs:
  supabase_org_id:
    type: string
    required: true
  orioledb:
    type: bool
    default: true
  project_size:
    type: string
    default: small
  disk_size_gb:
    type: int
    # Matches the Small tier's target in the RDS scenario's allocated_storage.
    # The raw 8x RAM_GB formula gives 16, but RDS Postgres on gp3 has a hard
    # 20 GiB minimum allocated storage, so both sides use 20 here to stay
    # matched -- override per tier alongside warehouses/threads, see the
    # invocation table in docs/supabase-vs-rds-benchmark.md. 0 disables the
    # resize call entirely (Supabase projects always start at 8 GB).
    default: 20
  disk_iops:
    type: int
    # The compute tier's own documented baseline IOPS, per
    # https://supabase.com/docs/guides/platform/compute-and-disk:
    # Small 1000 (default here) / Medium 2000 / Large 3600 / XL 6000.
    # Deliberately NOT hard-pinned to gp3's flat 3000 baseline for every tier
    # -- override alongside project_size/disk_size_gb so each tier gets what
    # it's actually documented to provide. See deployments/rds/postgres/main.tf's
    # size_map for the matching RDS-side values (clamped to gp3's 3,000 IOPS
    # floor for Small/Medium, where the docs baseline falls below it).
    default: 1000
  disk_throughput_mibps:
    type: int
    # 0 (default) omits throughput_mibps from the disk-config API call
    # entirely, so the Management API picks its own gp3 throughput.
    # Override via --set disk_throughput_mibps=<value> (MiB/s) to pin it
    # explicitly. Ignored when disk_type is io2 (that disk type doesn't
    # accept this attribute).
    default: 0
  disk_type:
    type: string
    # gp3 (default) or io2. gp3 caps out at min(500 IOPS/GB, 16,000);
    # tiers whose disk_iops exceeds that need "io2" instead, which the
    # Management API also supports (up to min(1000 IOPS/GB, 256,000)).
    default: gp3
  profile:
    type: string
    default: ""
  warehouses:
    type: int
    default: 80
  prepare_threads:
    type: int
    default: 12
  threads:
    type: list
    # Thread-count sweep for the benchmark (suite.fixtures below), not to be
    # confused with prepare_threads (data-load concurrency). Override with
    # --set threads=1,2,4,8,16,24.
    default: [1, 2, 4, 8, 16, 24]
  duration:
    type: duration
    default: 30m
  warmup_duration:
    type: duration
    default: 5m
  wal_settle_duration_secs:
    type: int
    # OrioleDB counterpart of scenarios/rds-tpcc-tiers.yaml's
    # wal_settle_duration_secs -- a fixed settle pause, not a poll. The
    # vanilla Supabase scenario's wait-for-archiver-catchup step instead
    # polls pg_ls_waldir() until it stops growing, which assumes core
    # Postgres's heap-AM WAL/archiving behavior; OrioleDB's own undo log and
    # storage engine work differently enough that this scenario doesn't rely
    # on that assumption, and just waits a fixed duration instead, same as
    # the RDS scenario does for its own (unrelated) reason of having no
    # pollable archive_command signal at all. See that scenario's own
    # comment for the fuller rationale on the "fixed pause vs. poll" choice.
    default: 720
  instance_type:
    type: string
    # Load driver (EC2) instance type, independent of the target's
    # project_size. The default is sized for small; bump this alongside
    # project_size for larger tiers (medium/large/xlarge and up) so the
    # driver's own vCPU count doesn't become the bottleneck instead of the
    # target.
    default: c8gd.xlarge
  region:
    type: string
    default: "us-east-1"
  metrics_enabled:
    type: bool
    default: false
  metrics_host_scrape_interval_secs:
    type: int
    default: 5
target:
  provider: supabase
  config:
    region: "{{ inputs.region }}"
    org_id: "{{ inputs.supabase_org_id }}"
    orioledb: "{{ inputs.orioledb }}"
    # Fixed, not an input: this scenario exists to isolate the DB engine/hardware
    # as the only variable in the Supabase-vs-RDS comparison. RDS has no HA
    # add-on equivalent and no Supavisor-style pooler, so both are held fixed
    # here rather than exposed as knobs. See docs/supabase-vs-rds-benchmark.md.
    high_availability: false
    connection_mode: direct
    profile: "{{ inputs.profile }}"
    project_size: "{{ inputs.project_size }}"
    disk_size_gb: "{{ inputs.disk_size_gb }}"
    disk_iops: "{{ inputs.disk_iops }}"
    disk_throughput_mibps: "{{ inputs.disk_throughput_mibps }}"
    disk_type: "{{ inputs.disk_type }}"
suite:
  iterations: 1
  fixtures:
    - threads:
        type: list
        params:
          values: "{{ inputs.threads }}"
  benchmarks:
    - name: orioledb
      steps:
        - name: get-pg-version
          type: metadata
          command: sql
          args:
            name: pg_version
            query: "SELECT version()"
        # To let this scenario support toggling the "orioledb" input boolean to false, ensure
        # this SQL can run on vanilla Postgres too. For vanilla Postgres, it returns NULL. For
        # OrioleDB, it returns the extension version. (Previously "SELECT orioledb_version()"
        # was used, but that function does not exist on vanilla Postgres.)
        - name: get-orioledb-extension-version
          type: metadata
          command: sql
          args:
            name: orioledb_extension_version
            query: "SELECT extversion FROM pg_catalog.pg_extension WHERE extname = 'orioledb'"
        - name: get-pg-settings
          type: metadata
          command: sql
          args:
            name: pg_settings
            # Captured for transparency, not enforced equal between platforms:
            # each side auto-tunes these per instance size using its own
            # formula, and the comparison targets each platform's managed
            # defaults rather than identical raw hardware.
            query: >-
              SELECT string_agg(name || '=' || setting, ', ' ORDER BY name) FROM pg_settings WHERE name IN ('shared_buffers', 'work_mem', 'max_connections', 'effective_cache_size')
        - name: network-rtt-baseline
          # Runs on the driver (the EC2 instance, once bootstrapped) — a TCP
          # connect-timing loop against the target host/port. Doesn't fix the
          # fact that Supabase's AZ placement isn't controllable by us (unlike
          # the pinned-AZ RDS scenario), but lets the results doc quantify how
          # much of any throughput gap traces to network path vs. engine/hardware.
          type: shell
          args:
            command: |
              bash -c '
                for i in $(seq 1 10); do
                  start_ns=$(date +%s%N)
                  timeout 5 bash -c "exec 3<>/dev/tcp/{{ target.outputs.host }}/{{ target.outputs.port }}" 2>/dev/null
                  status=$?
                  end_ns=$(date +%s%N)
                  if [ $status -eq 0 ]; then
                    echo "network-rtt-baseline: tcp_connect_ms=$(( (end_ns - start_ns) / 1000000 ))"
                  else
                    echo "network-rtt-baseline: tcp_connect_ms=timeout"
                  fi
                done
              '
        - name: prepare-warehouses
          type: go-tpc
          command: prepare
          args:
            warehouses: "{{ inputs.warehouses }}"
            # parallelize data load
            threads: "{{ inputs.prepare_threads }}"
            no-check: ""
            dropdata: ""
        - name: wal-settle-pause
          # See wal_settle_duration_secs above -- fixed pause rather than the
          # vanilla Supabase scenario's pg_ls_waldir()-polling
          # wait-for-archiver-catchup step, since OrioleDB's own storage
          # engine/undo log doesn't share the assumptions that poll relies on.
          type: shell
          args:
            command: "sleep {{ inputs.wal_settle_duration_secs }}"
        - name: warm-up
          # Discarded: workloadMetrics is overwritten by the next (measured)
          # go-tpc run step below, so this only serves to bring the connection
          # pool and buffer cache to steady state before the timed window.
          type: go-tpc
          command: run
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ fixture.threads }}"
            time: "{{ inputs.warmup_duration }}"
        - name: wal-stats-before-benchmark
          # Disk-sizing signal (see docs/compute-bound-calibration-plan-2026-09.md §9/§11 and
          # docs/compute-bound-sizing-formula-2026-09.md §5-7). pg_stat_wal is still valid for
          # OrioleDB -- WAL generation is a core Postgres mechanism this engine still uses --
          # unlike pg_stat_io/pg_stat_checkpointer/pg_stat_database below, which are NOT (see the
          # orioledb-footprint comment below for why those are omitted from this scenario
          # entirely). Bracketed before/after the benchmark step since wal_bytes is cumulative
          # since stats_reset, not since this run started -- the delta is this window's actual
          # WAL volume, one part of this engine's disk-throughput demand (the part core WAL
          # covers; it does not include OrioleDB's own data-file/undo-log I/O, which pg_stat_wal
          # cannot see).
          type: metadata
          command: sql
          args:
            name: wal_stats_before
            query: >-
              SELECT 'wal_bytes=' || wal_bytes FROM pg_stat_wal
        - name: orioledb-footprint-before-benchmark
          # OrioleDB-specific disk-size signal, standing in for the standard
          # pg_stat_io/pg_stat_checkpointer/pg_stat_database views this scenario deliberately
          # does NOT query: a 2026-09-04 full-30-minute-duration run confirmed those three
          # report near-zero/nonsensical deltas for OrioleDB (e.g. pg_stat_checkpointer showed
          # 770 buffers written across 8 million real transactions) because OrioleDB's storage
          # engine bypasses the standard heap-AM accounting those views rely on entirely -- see
          # docs/compute-bound-calibration-plan-2026-09.md §11 for the full finding. This query
          # (from that doc's §6, already confirmed accurate via a byte-for-byte `du -sh
          # /data/pgdata` cross-check in a prior session) sums data + WAL + undo log directly,
          # which is the one capacity signal that IS valid for this engine. Bracketed
          # before/after for the same cumulative-counter reason as wal_stats above -- the delta
          # is this window's actual footprint growth, a lower-bound proxy for write demand (it
          # won't capture in-place overwrites that don't grow total size).
          type: metadata
          command: sql
          args:
            name: orioledb_footprint_before
            query: >-
              SELECT 'total_bytes=' || (pg_database_size(current_database()) + (SELECT COALESCE(sum(size), 0) FROM pg_ls_waldir()) + (SELECT COALESCE(sum(undo_size), 0) FROM orioledb_undo_size()))::bigint
        - name: benchmark
          type: go-tpc
          command: run
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ fixture.threads }}"
            time: "{{ inputs.duration }}"
            interval: "1s"
        - name: wal-stats-after-benchmark
          type: metadata
          command: sql
          args:
            name: wal_stats_after
            query: >-
              SELECT 'wal_bytes=' || wal_bytes FROM pg_stat_wal
        - name: orioledb-footprint-after-benchmark
          type: metadata
          command: sql
          args:
            name: orioledb_footprint_after
            query: >-
              SELECT 'total_bytes=' || (pg_database_size(current_database()) + (SELECT COALESCE(sum(size), 0) FROM pg_ls_waldir()) + (SELECT COALESCE(sum(undo_size), 0) FROM orioledb_undo_size()))::bigint
driver:
  provider: ec2
  config:
    module: ./deployments/ec2/loaddriver_gotpc
    vars:
      instance_type: "{{ inputs.instance_type }}"
      region: "{{ inputs.region }}"
      vector_enabled: "{{ inputs.metrics_enabled }}"
      vector_sink: "{{ inputs.collector }}"
      vector_host_metrics_scrape_interval_secs: "{{ inputs.metrics_host_scrape_interval_secs }}"
      tags:
        created-by: benchctl
collector:
  provider: stdout
  config:
    file_enabled: true
