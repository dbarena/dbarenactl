# Sweep manifest for OrioleDB on Supabase.
#
# supabase_org_id is a required scenario input (your Supabase org, since a run creates a real,
# billed production project in it) with no sensible default.
#
# Supply with `dbarenactl run --candidate=candidates/orioledb-tpcc.yaml --set supabase_org_id=<your-org-id>`
provider: Supabase
product: OrioleDB
plan: Pro
workload: tpcc
region: us-east-1
scenario_path: scenario.yaml
test_points:
  - tier: small
    bound_type: io
    set:
      supabase_org_id: "{{ params.supabase_org_id }}"
      region: "us-east-1"
      project_size: small
      warehouses: "80"
      disk_size_gb: "20"
      disk_iops: "3000"
      disk_type: "gp3"
      client_threads: "1,2,4,8,12"
      instance_type: c8gd.xlarge
  - tier: small
    bound_type: compute
    set:
      supabase_org_id: "{{ params.supabase_org_id }}"
      region: "us-east-1"
      project_size: small
      warehouses: "8"
      disk_size_gb: "20"
      disk_iops: "3000"
      disk_throughput_mibps: "125"
      client_threads: "1,2,4,8,12"
