# Sweep manifest for `dbarenactl run --candidate=candidates/gcp-cloudsql-tpcc.yaml`.
#
# No 'small' tier; test points start with 'medium' as N4's minimum memory 
# ratio (2 GB/vCPU) puts its floor at 2vCPU/4GB which is identical to 'medium'.
#
# disk_iops/disk_throughput_mibps targets Supabase's own documented per-tier 
# IOPS/throughput baseline (https://supabase.com/docs/guides/platform/compute-and-disk)
# which is handled directly in benchctl, therefore no overrides are
# specified here.
provider: gcp/cloudsql
workload: tpcc
scenario_path: ../../benchctl/scenarios/gcp-cloudsql-tpcc-tiers.yaml
test_points:
  # medium: db-custom-N4-2-4096 (2 vCPU / 4 GB, matches RDS's db.t4g.medium),
  # 32 GB disk, 3,000 IOPS / 140 MiB/s. Supabase's documented Medium baseline
  # is 2,000 IOPS / 43 MiB/s, but HYPERDISK_BALANCED rejects both. Its floor
  # is 3,000 IOPS and 140 MiB/s.
  #
  # instance_type is the load driver's own GCE machine type (independent of
  # project_size).
  - tier: medium
    bound_type: io
    set:
      project_size: medium
      warehouses: "160"
      threads: "1,2,4,8,12"
      instance_type: c4a-standard-4
  - tier: medium
    bound_type: compute
    set:
      project_size: medium
      warehouses: "28"
      threads: "1,2,4,8,12"
      instance_type: c4a-standard-4
  # large: db-custom-N4-2-8192 (2 vCPU / 8 GB, matches RDS's db.m6g.large),
  # 64 GB disk, 3,600 IOPS (Supabase's documented Large baseline) / 140 MiB/s
  # (Supabase's documented 79 MiB/s is below HYPERDISK_BALANCED's 140 floor)
  - tier: large
    bound_type: io
    set:
      project_size: large
      warehouses: "320"
      threads: "1,2,4,8,12"
      instance_type: c4a-standard-4
  - tier: large
    bound_type: compute
    set:
      project_size: large
      warehouses: "56"
      threads: "1,2,4,8,12"
      instance_type: c4a-standard-4
  # xlarge: db-custom-N4-4-16384 (4 vCPU / 16 GB, matches RDS's db.m6g.xlarge),
  # 128 GB disk, 6,000 IOPS / 149 MiB/s (Supabase's documented XL baseline).
  - tier: xlarge
    bound_type: io
    set:
      project_size: xlarge
      warehouses: "640"
      threads: "1,2,4,8,16,24"
      instance_type: c4a-standard-4
  - tier: xlarge
    bound_type: compute
    set:
      project_size: xlarge
      warehouses: "112"
      threads: "1,2,4,8,16,24"
      instance_type: c4a-standard-4
  # 2xlarge: db-custom-N4-8-32768 (8 vCPU / 32 GB, matches RDS's
  # db.m6g.2xlarge), 256 GB disk, 12,000 IOPS / 297 MiB/s (Supabase's
  # documented 2XL baseline) -- HYPERDISK_BALANCED applies the size_map
  # default with no override needed, same as medium/large/xlarge.
  - tier: 2xlarge
    bound_type: io
    set:
      project_size: 2xlarge
      warehouses: "1280"
      threads: "1,2,4,8,16,32,48"
      instance_type: c4a-standard-8
  - tier: 2xlarge
    bound_type: compute
    set:
      project_size: 2xlarge
      warehouses: "224"
      threads: "1,2,4,8,16,32,48"
      instance_type: c4a-standard-8
  # 4xlarge: db-custom-N4-16-65536 (16 vCPU / 64 GB, matches RDS's
  # db.m6g.4xlarge), 512 GB disk, 20,000 IOPS / 594 MiB/s (Supabase's
  # documented 4XL baseline), size_map default, no override needed.
  - tier: 4xlarge
    bound_type: io
    set:
      project_size: 4xlarge
      warehouses: "2560"
      threads: "1,2,4,8,16,32,64,96"
      instance_type: c4a-standard-16
  - tier: 4xlarge
    bound_type: compute
    set:
      project_size: 4xlarge
      warehouses: "448"
      threads: "1,2,4,8,16,32,64,96"
      instance_type: c4a-standard-16
  # 8xlarge: db-custom-N4-32-131072 (32 vCPU / 128 GB, matches RDS's
  # db.m6g.8xlarge), 1024 GB disk, 40,000 IOPS / 1,188 MiB/s (Supabase's
  # documented 8XL baseline), size_map default, no override needed.
  - tier: 8xlarge
    bound_type: io
    set:
      project_size: 8xlarge
      warehouses: "5120"
      threads: "1,2,4,8,16,32,64,128,192"
      instance_type: c4a-standard-32
  - tier: 8xlarge
    bound_type: compute
    set:
      project_size: 8xlarge
      warehouses: "896"
      threads: "1,2,4,8,16,32,64,128,192"
      instance_type: c4a-standard-32
