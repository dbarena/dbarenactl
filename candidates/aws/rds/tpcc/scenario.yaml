apiVersion: bench/v1
kind: Scenario
metadata:
  name: rds-tpcc-ec2
  labels:
    engine: rds
    workload: tpcc
inputs:
  region:
    type: string
    default: "us-east-1"
    description: "AWS region to pick"
  db_instance_class:
    type: string
    default: db.t4g.small
    description: RDS DB instance class, e.g. "db.m9g.xlarge"
  engine_version:
    type: string
    default: "17.11"
    description: "Postgres version to use"
  pg_user:
    type: string
    default: "bench"
    description: "Postgres user name"
  pg_password:
    type: string
    default: "benchbench"
    description: "Postgres password"
  disk_size_gb:
    type: int
    default: 20
    description: Disk size in GB
  disk_iops:
    type: int
    # gp3 provisioned IOPS. Only takes effect if disk_size_gb is >= 400.
    #
    # see also https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html#gp3-storage
    default: 3000
    description: Provisioned IOPS (only for disk_size_gb >= 400)
  disk_throughput_mibps:
    type: int
    # gp3 provisioned throughput (MiB/s). 0 (default) omits the argument,
    # letting AWS apply gp3's free baseline for disk_size_gb/disk_iops.
    #
    # see also https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html#gp3-storage
    default: 0
    description: Provisioned disk throughput (only for disk_size_gb >= 400)
  warehouses:
    type: int
    default: 80
    description: Number of warehouses to simulate
  prepare_threads:
    type: int
    default: 12
    description: Number of clients for data loading
  client_threads:
    type: list
    default: [1, 2, 4, 8, 16, 24]
    description: Number of clients for the actual benchmark
  duration:
    type: duration
    default: 60m
    description: Duration of the actual benchmark
  warmup_duration:
    type: duration
    default: 30m
    description: Duration of the warmup phase for the benchmark
  driver_instance_type:
    type: string
    # Load driver (EC2) machine type, independent of the target's capabilities. 
    # Bump this alongside the target to avoid accidental bottlenecks.
    default: c8gd.xlarge
    description: Instance type of the load driver instance
  metrics_enabled:
    type: bool
    default: true
    description: Whether to capture metrics on the load driver instance
  metrics_interval_secs:
    type: int
    default: 5
    description: Interval in which to get load test driver metrics
target:
  provider: opentofu
  config:
    module: ./deployments/rds/postgres
    vars:
      db_instance_class: "{{ inputs.db_instance_class }}"
      engine_version: "{{ inputs.engine_version }}"
      region: "{{ inputs.region }}"
      pg_user: "{{ inputs.pg_user }}"
      pg_password: "{{ inputs.pg_password }}"
      allocated_storage_gb: "{{ inputs.disk_size_gb }}"
      iops: "{{ inputs.disk_iops }}"
      disk_throughput_mibps: "{{ inputs.disk_throughput_mibps }}"
suite:
  iterations: 1
  fixtures:
    - client_threads:
        type: list
        params:
          values: "{{ inputs.client_threads }}"
  benchmarks:
    - name: rds
      steps:
        - name: get-pg-version
          type: metadata
          command: sql
          args:
            name: pg_version
            query: "SELECT version()"
        - name: get-pg-settings
          type: metadata
          command: sql
          args:
            name: pg_settings
            # Captured for transparency, but we never tune the providers' defaults.
            query: >-
              SELECT string_agg(name || '=' || setting, ', ' ORDER BY name) FROM pg_settings WHERE name IN ('shared_buffers', 'work_mem', 'max_connections', 'effective_cache_size', 'max_wal_size', 'checkpoint_completion_target', 'synchronous_commit')
        - name: network-rtt-baseline
          # Colocation sanity check. The driver is deterministically pinned to the
          # same AZ as the RDS instance (see deployments/rds/postgres/main.tf),
          # so this should read consistently low. Reported in microseconds: a
          # driver that landed on a worse path costs a fraction of a millisecond
          # per round trip, which millisecond resolution cannot show.
          type: metadata
          command: rtt
          args:
            name: network_rtt
        - name: prepare-warehouses
          type: go-tpc
          command: prepare
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ inputs.prepare_threads }}"
            no-check: ""
            dropdata: ""
        - name: warmup
          # The metrics from this run are discarded and only meant to bring the system to a steady state.
          type: go-tpc
          command: run
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ fixture.client_threads }}"
            time: "{{ inputs.warmup_duration }}"
            interval: "10s"
        - name: get-wal-size-before-benchmark
          # Disk-sizing signal
          type: metadata
          command: sql
          args:
            name: wal_size_before
            query: >-
              SELECT 'wal_bytes=' || wal_bytes FROM pg_stat_wal
        - name: get-db-size-before-benchmark
          # Disk-sizing signal, reported per component. db_bytes is the size
          # of the resident data set; waldir_bytes is churn.
          type: metadata
          command: sql
          args:
            name: db_size_before
            query: >-
              SELECT 'db_bytes=' || pg_database_size(current_database()) || ',waldir_bytes=' || (SELECT COALESCE(sum(size), 0)::bigint FROM pg_ls_waldir())
        - name: get-cache-stats-before-benchmark
          # Buffer cache hit ratio measured as:
          #
          #  blks_hit / (blks_hit + blks_read)
          #
          # over the measured window. pg_stat_database's counters are
          # cumulative since the instance came up, so the ratio has to be read
          # as the delta between this snapshot and the measurement after the
          # benchmarks. Note that a miss in shared buffers may still hit the
          # filesystem page cache, so treat this is worst case estimate.
          type: metadata
          command: sql
          args:
            name: cache_stats_before
            query: >-
              SELECT 'blks_hit=' || blks_hit || ',blks_read=' || blks_read || ',xact_commit=' || xact_commit FROM pg_stat_database WHERE datname = current_database()
        - name: benchmark
          type: go-tpc
          command: run
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ fixture.client_threads }}"
            time: "{{ inputs.duration }}"
            interval: "10s"
        - name: get-wal-size-after-benchmark
          type: metadata
          command: sql
          args:
            name: wal_size_after
            query: >-
              SELECT 'wal_bytes=' || wal_bytes FROM pg_stat_wal
        - name: get-db-size-after-benchmark
          type: metadata
          command: sql
          args:
            name: db_size_after
            query: >-
              SELECT 'db_bytes=' || pg_database_size(current_database()) || ',waldir_bytes=' || (SELECT COALESCE(sum(size), 0)::bigint FROM pg_ls_waldir())
        - name: get-cache-stats-after-benchmark
          type: metadata
          command: sql
          args:
            name: cache_stats_after
            query: >-
              SELECT 'blks_hit=' || blks_hit || ',blks_read=' || blks_read || ',xact_commit=' || xact_commit FROM pg_stat_database WHERE datname = current_database()
driver:
  provider: ec2
  config:
    module: ./deployments/ec2/loaddriver_gotpc
    vars:
      instance_type: "{{ inputs.driver_instance_type }}"
      region: "{{ inputs.region }}"
      subnet_id: "{{ target.outputs.subnet_id }}"
      vector_enabled: "{{ inputs.metrics_enabled }}"
      vector_sink: stdout
      vector_host_metrics_scrape_interval_secs: "{{ inputs.metrics_interval_secs }}"
collector:
  provider: stdout
  config:
    file_enabled: true
