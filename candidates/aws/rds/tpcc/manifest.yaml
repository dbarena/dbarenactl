# Sweep manifest for AWS RDS
#
# Supply with `dbarenactl run --candidate=candidates/aws/rds/tpcc/manifest.yaml`.
provider: AWS
product: RDS
workload: tpcc
region: us-east-1
scenario_path: scenario.yaml
test_points:
  - tier: small
    bound_type: cache-exceeding
    set:
      db_instance_class: db.t4g.small
      warehouses: "80"
      prepare_threads: "8"
      client_threads: "2,4,8,12"
      driver_instance_type: c8gd.xlarge
      disk_size_gb: "20"
      disk_iops: "3000"
    pricing:
      disk_type: gp3
  - tier: small
    bound_type: cache-fit
    set:
      db_instance_class: db.t4g.small
      warehouses: "8"
      prepare_threads: "8"
      client_threads: "2,4,8,12"
      driver_instance_type: c8gd.xlarge
      disk_size_gb: "20"
      disk_iops: "3000"
    pricing:
      disk_type: gp3
  - tier: medium
    bound_type: cache-exceeding
    set:
      db_instance_class: db.t4g.medium
      warehouses: "160"
      prepare_threads: "8"
      client_threads: "2,4,8,12"
      driver_instance_type: c8gd.xlarge
      disk_size_gb: "32"
      disk_iops: "3000"
    pricing:
      disk_type: gp3
  - tier: medium
    bound_type: cache-fit
    set:
      db_instance_class: db.t4g.medium
      warehouses: "16"
      prepare_threads: "8"
      client_threads: "2,4,8,12"
      driver_instance_type: c8gd.xlarge
      disk_size_gb: "20"
      disk_iops: "3000"
    pricing:
      disk_type: gp3
  - tier: large
    bound_type: cache-exceeding
    set:
      db_instance_class: db.m9g.large
      warehouses: "320"
      prepare_threads: "8"
      client_threads: "2,4,8,12"
      driver_instance_type: c8gd.xlarge
      disk_size_gb: "64"
      disk_iops: "3000"
    pricing:
      disk_type: gp3
  - tier: large
    bound_type: cache-fit
    set:
      db_instance_class: db.m9g.large
      warehouses: "32"
      prepare_threads: "8"
      client_threads: "2,4,8,12"
      driver_instance_type: c8gd.xlarge
      disk_size_gb: "20"
      disk_iops: "3000"
    pricing:
      disk_type: gp3
  - tier: xlarge
    bound_type: cache-exceeding
    set:
      db_instance_class: db.m9g.xlarge
      warehouses: "640"
      disk_size_gb: "400"
      disk_iops: "12000"
      disk_throughput_mibps: "500"
      prepare_threads: "8"
      client_threads: "4,8,16,24"
      driver_instance_type: c8gd.xlarge
    pricing:
      disk_type: gp3
      # per https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html — gp3's baseline jumps to 12,000 IOPS/500 MiB/s at >=400 GiB for Postgres
      disk_baseline_iops: "12000"
      disk_baseline_throughput_mibps: "500"
  - tier: xlarge
    bound_type: cache-fit
    set:
      db_instance_class: db.m9g.xlarge
      warehouses: "64"
      prepare_threads: "8"
      client_threads: "4,8,16,24"
      driver_instance_type: c8gd.xlarge
      disk_size_gb: "20"
      disk_iops: "3000"
    pricing:
      disk_type: gp3
  - tier: 2xlarge
    bound_type: cache-exceeding
    set:
      db_instance_class: db.m9g.2xlarge
      warehouses: "1280"
      disk_size_gb: "400"
      disk_iops: "12000"
      disk_throughput_mibps: "500"
      prepare_threads: "16"
      client_threads: "8,16,24,48"
      driver_instance_type: c8gd.2xlarge
    pricing:
      disk_type: gp3
      # per https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html — gp3's baseline jumps to 12,000 IOPS/500 MiB/s at >=400 GiB for Postgres
      disk_baseline_iops: "12000"
      disk_baseline_throughput_mibps: "500"
  - tier: 2xlarge
    bound_type: cache-fit
    set:
      db_instance_class: db.m9g.2xlarge
      warehouses: "128"
      prepare_threads: "16"
      client_threads: "8,16,24,48"
      driver_instance_type: c8gd.2xlarge
      disk_size_gb: "400"
      disk_iops: "12000"
      disk_throughput_mibps: "500"
    pricing:
      disk_type: gp3
      disk_baseline_iops: "12000"
      disk_baseline_throughput_mibps: "500"
  # 4xlarge: db.m9g.4xlarge. disk_size_gb (512 GB) is already >= the 400 GiB
  # threshold, so disk_iops (20,000) takes effect with no extra sizing needed.
  # For pricing calculation we still need to state explicitly that >=400 GiB
  # the free baseline IOPS/throughput changes.
  - tier: 4xlarge
    bound_type: cache-exceeding
    set:
      db_instance_class: db.m9g.4xlarge
      warehouses: "2560"
      prepare_threads: "32"
      client_threads: "16,32,64,128"
      driver_instance_type: c8gd.4xlarge
      disk_size_gb: "512"
      disk_iops: "20000"
      disk_throughput_mibps: "600"
    pricing:
      disk_type: gp3
      disk_baseline_iops: "12000"
      disk_baseline_throughput_mibps: "500"
  - tier: 4xlarge
    bound_type: cache-fit
    variant: cost-optimized
    set:
      db_instance_class: db.m9g.4xlarge
      warehouses: "256"
      prepare_threads: "32"
      client_threads: "16,32,64,128"
      driver_instance_type: c8gd.4xlarge
      disk_size_gb: "400"
      disk_iops: "12000"
      disk_throughput_mibps: "500"
    pricing:
      disk_type: gp3
      disk_baseline_iops: "12000"
      disk_baseline_throughput_mibps: "500"
  - tier: 4xlarge
    bound_type: cache-fit
    variant: performance-optimized
    set:
      db_instance_class: db.m9g.4xlarge
      warehouses: "256"
      prepare_threads: "32"
      client_threads: "16,32,64,128"
      driver_instance_type: c8gd.4xlarge
      disk_size_gb: "400"
      disk_iops: "20000"
      disk_throughput_mibps: "600"
    pricing:
      disk_type: gp3
      disk_baseline_iops: "12000"
      disk_baseline_throughput_mibps: "500"
  - tier: 8xlarge
    bound_type: cache-exceeding
    set:
      db_instance_class: db.m9g.8xlarge
      warehouses: "5120"
      prepare_threads: "32"
      client_threads: "32,64,128,256"
      driver_instance_type: c8gd.8xlarge
      disk_size_gb: "1024"
      disk_iops: "40000"
      disk_throughput_mibps: "1200"
    pricing:
      disk_type: gp3
      disk_baseline_iops: "12000"
      disk_baseline_throughput_mibps: "500"
  - tier: 8xlarge
    bound_type: cache-fit
    variant: cost-optimized
    set:
      db_instance_class: db.m9g.8xlarge
      warehouses: "512"
      prepare_threads: "32"
      client_threads: "32,64,128,256"
      driver_instance_type: c8gd.8xlarge
      disk_size_gb: "400"
      disk_iops: "12000"
      disk_throughput_mibps: "500"
    pricing:
      disk_type: gp3
      disk_baseline_iops: "12000"
      disk_baseline_throughput_mibps: "500"
  - tier: 8xlarge
    bound_type: cache-fit
    variant: performance-optimized
    set:
      db_instance_class: db.m9g.8xlarge
      warehouses: "512"
      prepare_threads: "32"
      client_threads: "32,64,128,256"
      driver_instance_type: c8gd.8xlarge
      disk_size_gb: "400"
      disk_iops: "40000"
      disk_throughput_mibps: "1200"
    pricing:
      disk_type: gp3
      disk_baseline_iops: "12000"
      disk_baseline_throughput_mibps: "500"
