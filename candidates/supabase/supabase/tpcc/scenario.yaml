apiVersion: bench/v1
kind: Scenario
metadata:
  name: supabase-tpcc-prod
  labels:
    engine: supabase
    workload: tpcc
inputs:
  supabase_org_id:
    type: string
    required: true
    description: Supabase organization id for the target project
  project_size:
    type: string
    default: small
    description: Supabase project size
  disk_size_gb:
    type: int
    default: 20
    description: Disk size in GB
  disk_iops:
    type: int
    default: 1000
    description: Provisioned IOPS
  disk_throughput_mibps:
    type: int
    # 0 (default) omits throughput_mibps from the disk-config API call
    # so the Management API picks its own gp3 throughput.
    # 
    # Ignored when disk_type is io2 (that disk type doesn't accept this attribute).
    default: 0
    description: Provisioned disk throughput
  disk_type:
    type: string
    default: gp3
    description: Disk type, gp3 or io2
  profile:
    type: string
    default: ""
    description: Supabase infrastructure profile to target
  warehouses:
    type: int
    default: 80
    description: Number of warehouses to simulate
  prepare_threads:
    type: int
    default: 12
    description: Number of clients for data loading
  client_threads:
    type: list
    default: [1, 2, 4, 8, 16, 24]
    description: Number of clients for the actual benchmark
  duration:
    type: duration
    default: 60m
    description: Duration of the actual benchmark
  warmup_duration:
    type: duration
    default: 30m
    description: Duration of the warmup phase for the benchmark
  driver_instance_type:
    type: string
    # Load driver (EC2) machine type, independent of the target's capabilities. 
    # Bump this alongside the target to avoid accidental bottlenecks.
    default: c8gd.xlarge
    description: Instance type of the load driver instance
  region:
    type: string
    default: "us-east-1"
    description: AWS region to pick
  metrics_enabled:
    type: bool
    default: false
    description: Whether to capture metrics on the load driver instance
  metrics_interval_secs:
    type: int
    default: 5
    description: Interval in which to get load test driver metrics
target:
  provider: supabase
  config:
    region: "{{ inputs.region }}"
    org_id: "{{ inputs.supabase_org_id }}"
    high_availability: false
    connection_mode: direct
    profile: "{{ inputs.profile }}"
    project_size: "{{ inputs.project_size }}"
    disk_size_gb: "{{ inputs.disk_size_gb }}"
    disk_iops: "{{ inputs.disk_iops }}"
    disk_throughput_mibps: "{{ inputs.disk_throughput_mibps }}"
    disk_type: "{{ inputs.disk_type }}"
suite:
  iterations: 1
  fixtures:
    - client_threads:
        type: list
        params:
          values: "{{ inputs.client_threads }}"
  benchmarks:
    - name: supabase
      steps:
        - name: get-pg-version
          type: metadata
          command: sql
          args:
            name: pg_version
            query: "SELECT version()"
        - name: get-pg-settings
          type: metadata
          command: sql
          args:
            name: pg_settings
            # Captured for transparency, not enforced equal between platforms:
            # each side auto-tunes these per instance size using its own
            # formula, and the comparison targets each platform's managed
            # defaults rather than identical raw hardware.
            query: >-
              SELECT string_agg(name || '=' || setting, ', ' ORDER BY name) FROM pg_settings WHERE name IN ('shared_buffers', 'work_mem', 'max_connections', 'effective_cache_size')
        - name: network-rtt-baseline
          # Round trips from the driver (the EC2 instance, once bootstrapped) to
          # the target. Doesn't fix the fact that Supabase's AZ placement isn't
          # controllable by us (unlike the pinned-AZ RDS scenario), but lets the
          # results doc quantify how much of any throughput gap traces to network
          # path vs. engine/hardware. Reported in microseconds.
          type: metadata
          command: rtt
          args:
            name: network_rtt
        - name: prepare-warehouses
          type: go-tpc
          command: prepare
          once: true
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ inputs.prepare_threads }}"
            no-check: ""
            dropdata: ""
        - name: warmup
          # The metrics from this run are discarded and only meant to bring the system to a steady state.
          type: go-tpc
          command: run
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ fixture.client_threads }}"
            time: "{{ inputs.warmup_duration }}"
            interval: "10s"
        - name: benchmark
          type: go-tpc
          command: run
          args:
            warehouses: "{{ inputs.warehouses }}"
            threads: "{{ fixture.client_threads }}"
            time: "{{ inputs.duration }}"
            interval: "10s"
        - name: get-db-size
          type: metadata
          command: sql
          args:
            name: db_size
            query: "SELECT pg_size_pretty(pg_database_size(current_database()))"
        - name: get-wal-size
          type: metadata
          command: sql
          args:
            name: wal_size
            query: "SELECT pg_size_pretty(COALESCE(sum(size), 0)) FROM pg_ls_waldir()"
driver:
  provider: ec2
  config:
    module: ./deployments/ec2/loaddriver_gotpc
    vars:
      instance_type: "{{ inputs.driver_instance_type }}"
      region: "{{ inputs.region }}"
      vector_enabled: "{{ inputs.metrics_enabled }}"
      vector_sink: stdout
      vector_host_metrics_scrape_interval_secs: "{{ inputs.metrics_interval_secs }}"
collector:
  provider: stdout
  config:
    file_enabled: true
