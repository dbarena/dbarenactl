# Sweep manifest for Supabase
#
# supabase_org_id is a required scenario input (your Supabase org).
#
# Supply with `dbarenactl run --candidate=candidates/supabase/supabase/tpcc/manifest.yaml --set supabase_org_id=<your-org-id>`
provider: Supabase
product: Supabase
plan: Pro
workload: tpcc
region: us-east-1
scenario_path: scenario.yaml
test_points:
  - tier: small
    bound_type: cache-exceeding
    set:
      supabase_org_id: "{{ params.supabase_org_id }}"
      region: "us-east-1"
      project_size: small
      warehouses: "80"
      disk_size_gb: "20"
      disk_iops: "3000"
      disk_type: "gp3"
      prepare_threads: "8"
      client_threads: "2,4,8,12"
      driver_instance_type: c8gd.xlarge
  - tier: small
    bound_type: cache-fit
    set:
      supabase_org_id: "{{ params.supabase_org_id }}"
      region: "us-east-1"
      project_size: small
      warehouses: "8"
      disk_size_gb: "20"
      disk_iops: "3000"
      disk_throughput_mibps: "125"
      prepare_threads: "8"
      client_threads: "2,4,8,12"
      driver_instance_type: c8gd.xlarge
  - tier: medium
